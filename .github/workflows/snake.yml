name: generate snake animation

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {} # permite rodar manualmente pelo botão "Run workflow"
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: generate github-contribution-grid snake
        uses: Platane/snk@v3
        with:
          github_user_name: ArthurNunesDev
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif?color_snake=B983FF&color_dots=161b22,3d1f6e,5a2fa8,7c4ddb,B983FF

      - name: push github-contribution-grid snake artifacts
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: generate animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: ArthurNunesDev
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#c084fc,#7c3aed&color_dots=#0d0b14,#3b1e6d,#5b21b6,#7c3aed,#a855f7&color_dots_border=#1e1b2e
            dist/github-contribution-grid-snake-dark.svg?color_snake=#e9d5ff,#9333ea&color_dots=#161320,#3b1e6d,#6d28d9,#8b5cf6,#c084fc&color_dots_border=#1e1b2e

      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

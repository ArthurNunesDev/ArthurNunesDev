name: Generate arcade animation

on:
  schedule:
    - cron: "0 */12 * * *"   # roda às 00:00 e 12:00 UTC

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Escolher o jogo da vez (baseado no horário)
        id: pick
        run: |
          GAMES=(snake pacman)
          EPOCH=$(date +%s)
          INDEX=$(( (EPOCH / 43200) % 2 ))   # 43200s = 12h -> alterna entre os 2 jogos
          GAME=${GAMES[$INDEX]}
          echo "game=$GAME" >> "$GITHUB_OUTPUT"
          echo "Jogo escolhido: $GAME (index $INDEX)"

      - name: Gerar Snake (light + dark)
        if: steps.pick.outputs.game == 'snake'
        uses: Platane/snk@v3
        with:
          github_user_name: ArthurNunesDev
          outputs: |
            dist/arcade.svg?color_snake=#c084fc&color_dots=#0d0b14,#3b1e6d,#5b21b6,#7c3aed,#a855f7&color_dots_border=#1e1b2e
            dist/arcade-dark.svg?color_snake=#e9d5ff&color_dots=#161320,#3b1e6d,#6d28d9,#8b5cf6,#c084fc&color_dots_border=#1e1b2e

      - name: Gerar Pacman (light + dark, igual ao padrão da lib)
        if: steps.pick.outputs.game == 'pacman'
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      - name: Renomear Pacman para nome fixo (arcade.svg / arcade-dark.svg)
        if: steps.pick.outputs.game == 'pacman'
        run: |
          mv "dist/pacman-contribution-graph.svg" "dist/arcade.svg"
          mv "dist/pacman-contribution-graph-dark.svg" "dist/arcade-dark.svg"

      - name: Publicar no branch de output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: pacman-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
